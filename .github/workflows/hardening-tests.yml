name: hardening-tests

on:
  push:
    branches: ["hardening/epistemic-boundary"]
  pull_request:
    branches: ["main"]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest -q tests

  insurance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r fap-insurance/requirements.txt
      - run: python -m pip install pytest httpx2
      - run: PYTHONPATH=fap-insurance python -m pytest -q fap-insurance/tests
